; PlatformIO project configuration for y4n0 (ESP-IDF framework)
;
; This is a native ESP-IDF project; PlatformIO drives the same root CMakeLists.txt,
; main/ and components/. The full chip config is carried in sdkconfig.defaults
; (seeded from the working idf.py sdkconfig: BT/NimBLE, custom partitions, 2MB flash).
;
; Build : pio run
; Flash : pio run -t upload
; Serial: pio device monitor

[platformio]
; This is a native ESP-IDF project (root CMakeLists.txt + main/ component),
; so point PlatformIO's source dir at main/ instead of the default src/.
src_dir = main

[env:esp32doit-devkit-v1]
; Pin to the platform that ships ESP-IDF 5.1.2 (matches dependencies.lock).
; Newer espressif32 (7.x) bundles GCC 15, which hard-errors on build flags and
; warnings this codebase wasn't written against.
platform = espressif32@6.5.0
board = esp32doit-devkit-v1
framework = espidf

board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_mode = dio

monitor_speed = 115200
